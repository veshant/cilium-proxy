name: Build Cilium 1.20.2 Envoy test image

on:
  push:
    branches:
      - test-cilium-1.20.2-ghcr

permissions:
  contents: read
  packages: write

concurrency:
  group: test-ghcr-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source version and prepare build context
        shell: bash
        run: |
          test "$(cat ENVOY_VERSION)" = envoy-1.37.6
          grep -q 'upstream_remote_address && upstream_local_address' cilium/l7policy.cc
          make SOURCE_VERSION Dockerfile.dockerignore
          df -h . /var/lib/docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 test image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILDER_BASE=quay.io/cilium/cilium-envoy-builder-dev:b70e7720553bee71e2323955a88f64271a8dfc7a
            ARCHIVE_IMAGE=quay.io/cilium/cilium-envoy-builder:v1.37-archive-latest
            BAZEL_BUILD_OPTS=--jobs=2 --remote_upload_local_results=false
          push: true
          tags: ghcr.io/veshant/cilium-envoy-test:1.20.2-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/veshant/cilium-proxy

      - name: Check published binary version
        shell: bash
        run: |
          image="ghcr.io/veshant/cilium-envoy-test:1.20.2-${GITHUB_SHA}"
          docker run --rm "${image}" cilium-envoy --version | tee version.txt
          grep -q '1.37.6' version.txt
          echo "Image: ${image}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
